<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="pinterest" content="nopin" />
<title>Dropbox BG Remover</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <div class="header-row">
      <h1>Dropbox Background Remover</h1>
      <button id="stop-btn" type="button" class="stop-btn">Stop Server</button>
    </div>

    <section class="panel">
      <h2>1. Choose a folder</h2>
      <div id="breadcrumb" class="breadcrumb"></div>
      <ul id="folder-list" class="folder-list"></ul>
      <div class="chosen-row">
        <span>Selected: <code id="chosen-path">/</code></span>
        <button id="load-btn" type="button">Load images in this folder</button>
      </div>
    </section>

    <section class="panel">
      <h2>2. Select images to process</h2>
      <div id="picker-empty" class="gallery-empty">Load a folder above to see its images.</div>
      <div id="picker-gallery" class="gallery"></div>
      <div id="picker-actions" class="gallery-actions" hidden>
        <span id="selected-count">0 selected</span>
        <select id="provider-select"></select>
        <button id="run-btn" type="button" disabled>Run</button>
      </div>
    </section>

    <section class="panel">
      <h2>3. Progress</h2>
      <div id="run-status" class="run-status">No run started yet.</div>
      <ul id="event-log" class="event-log"></ul>
    </section>

    <section class="panel">
      <h2>4. Processed images</h2>
      <div id="processed-empty" class="gallery-empty">Nothing processed yet.</div>
      <div id="processed-gallery" class="gallery"></div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
